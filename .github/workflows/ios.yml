name: Build iOS IPA
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Build unsigned IPA
        run: |
          xcodebuild -project Salati.xcodeproj -target Salati -configuration Release -sdk iphoneos SYMROOT=build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" clean build
          APP_PATH="build/Release-iphoneos/Salati.app"
          ls -lh "$APP_PATH"
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -r Salati.ipa Payload
          ls -lh Salati.ipa
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Salati-IPA
          path: Salati.ipa
